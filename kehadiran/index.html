<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Check-In Tamu</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>
<body>

    <!-- BACKGROUND -->

    <div class="bg-blur one"></div>
    <div class="bg-blur two"></div>

    <!-- CONTAINER -->

    <div class="container">

        <!-- TOP AREA STICKY -->

        <div class="top-area">

            <!-- HEADER -->

            <div class="header">

                <h1>
                    Check-In Tamu
                </h1>

                <p>
                    Cari nama tamu lalu simpan kehadiran
                </p>

            </div>

            <!-- SEARCH -->

            <div class="search-box">

                <input
                    type="text"
                    id="search"
                    placeholder="Cari nama tamu..."
                    autocomplete="off"
                >

            </div>

        </div>

        <!-- LOADING -->

        <div
            id="loading"
            class="hidden"
        >

            <div class="spinner"></div>

            <span>
                Memuat data tamu...
            </span>

        </div>

        <!-- SEARCH RESULT -->

        <div id="result"></div>

        <!-- SELECTED CARD -->

        <div class="card">

            <div class="card-title">

                Daftar Kehadiran

            </div>

            <div id="selected"></div>

            <button
                id="saveBtn"
                onclick="saveAttendance()"
            >
                SIMPAN KEHADIRAN
            </button>

        </div>

        <!-- SUCCESS -->

        <div id="successCard">

            <div id="qrCapture">

                <div class="success-icon">
                    ✓
                </div>

                <h2>
                    Berhasil Disimpan
                </h2>

                <!-- QR -->

                <div id="qrcode"></div>

                <!-- ID -->

                <div id="regId"></div>

                <!-- MEMBER -->

                <div id="memberList"></div>

            </div>

            <!-- ACTION -->

            <div class="qr-actions">

                <button onclick="downloadQR()">
                    SIMPAN
                </button>

                <button onclick="printQR()">
                    PRINT
                </button>

                <button onclick="closeQR()">
                    CLOSE
                </button>

            </div>

        </div>

    </div>

    <!-- TOAST -->
    <div id="toast"></div>

    <!-- HTML2CANVAS -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <!-- APP -->

    <script src="app.js"></script>

</body>
</html>
