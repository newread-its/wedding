<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1">

<title>Print Registrasi</title>

<link
    rel="stylesheet"
    href="print.css">

</head>

<body>

<div class="container">

    <div class="top-area">

        <div class="top-bar">

            <h2>
                Data Print
            </h2>

            <button
                id="refreshBtn"
                class="refresh-btn">

                ⟳

            </button>

        </div>

        <input
            type="text"
            id="searchInput"
            placeholder="Cari Nama Tamu">

        <div class="tabs">

            <button
                id="tabBelum"
                class="active">

                Belum Print

            </button>

            <button
                id="tabSudah">

                Sudah Print

            </button>

        </div>

    </div>

    <div id="loadingBox">

        <div class="loader"></div>

    </div>

    <div id="listData"></div>

</div>

<script src="print.js"></script>

</body>

</html>
